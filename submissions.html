<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Submissions &mdash; TurboGlow Cleaning</title>
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f4f6fb;
    }

    h1 {
      margin: 0 0 1rem;
      color: #001f54;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    button {
      padding: 0.6rem 1rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    button.primary {
      background: #001f54;
      color: white;
    }

    button.secondary {
      background: #e0e0e0;
      color: #111;
    }

    a.back {
      color: #001f54;
      text-decoration: none;
      margin-left: auto;
    }

    a.back:hover {
      text-decoration: underline;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    th,
    td {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      vertical-align: top;
    }

    thead {
      background: #001f54;
      color: white;
    }

    tbody tr:hover {
      background: rgba(0, 31, 84, 0.05);
    }

    tbody tr.unread {
      font-weight: bold;
      background: rgba(0, 31, 84, 0.02);
    }

    .status-badge {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .status-unread {
      background: #ffd700;
      color: #333;
    }

    .status-read {
      background: #4caf50;
      color: white;
    }

    button.toggle-btn {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      background: #eee;
      color: #333;
      border: 1px solid #ccc;
    }

    button.toggle-btn:hover {
      background: #ddd;
    }

    .empty {
      padding: 3rem;
      text-align: center;
      color: #555;
    }

    .note {
      font-size: 0.9rem;
      color: #555;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Saved Quote Requests</h1>
  <div class="toolbar">
    <button class="primary" id="refreshBtn">Refresh</button>
    <button class="secondary" id="clearBtn">Clear all</button>
    <button class="secondary" id="logoutBtn">Logout</button>
    <a class="back" href="/">&larr; Back to site</a>
  </div>
  <div id="output"></div>

  <script>
    const output = document.getElementById('output');
    const refreshBtn = document.getElementById('refreshBtn');
    const clearBtn = document.getElementById('clearBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function toggleStatus(id) {
      try {
        const res = await fetch('/api/submissions/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        if (res.ok) {
          loadSubmissions();
        } else {
          const data = await res.json();
          alert('Error: ' + data.error);
        }
      } catch (err) {
        alert('Failed to toggle status.');
      }
    }

    async function loadSubmissions() {
      output.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const res = await fetch('/api/submissions');
        if (res.status === 401) {
          window.location.href = '/login.html';
          return;
        }
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          output.innerHTML = '<div class="empty">No submissions yet.</div>';
          return;
        }

        const rows = data
          .map((item) => {
            const receivedAt = escapeHtml(new Date(item.receivedAt || '').toLocaleString());
            const name = escapeHtml(item.name);
            const phone = escapeHtml(item.phone);
            const email = escapeHtml(item.email);
            const service = escapeHtml(item.service);
            const address = escapeHtml(item.address);
            const details = escapeHtml(item.details);
            const status = item.status === 'read' ? 'read' : 'unread';
            const id = escapeHtml(item.id);

            return `
              <tr class="${status}">
                <td>${receivedAt}</td>
                <td>
                  <span class="status-badge status-${status}">${status}</span>
                </td>
                <td>${name}</td>
                <td>${phone}</td>
                <td>${email}</td>
                <td>${service}</td>
                <td>${address}</td>
                <td>${details}</td>
                <td>
                  <button class="toggle-btn" onclick="toggleStatus('${id}')">
                    Mark as ${status === 'read' ? 'Unread' : 'Read'}
                  </button>
                </td>
              </tr>
            `;
          })
          .join('');

        output.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Received</th>
                <th>Status</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Service</th>
                <th>Address</th>
                <th>Details</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        `;
      } catch (error) {
        output.innerHTML = `<div class="empty">Unable to load submissions.<br>${error.message}</div>`;
      }
    }

    async function clearAll() {
      if (!confirm('Clear all saved submissions? This cannot be undone.')) return;
      try {
        const res = await fetch('/api/submissions', { method: 'DELETE' });
        if (res.ok) {
          loadSubmissions();
        } else {
          throw new Error('Failed to clear');
        }
      } catch (err) {
        alert('Failed to clear submissions.');
      }
    }

    refreshBtn.addEventListener('click', loadSubmissions);
    clearBtn.addEventListener('click', clearAll);
    logoutBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/logout', { method: 'POST' });
      } finally {
        window.location.href = '/login.html';
      }
    });

    loadSubmissions();
  </script>
</body>
</html>
